name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Exercise the Postgres (multi-writer / production) metadata backend. Without
    # ORIGOFS_PG_TEST_URL the PG-gated suites (postgres.rs, concurrency.rs,
    # subscribe.rs) self-skip and only the SQLite path is tested.
    env:
      ORIGOFS_PG_TEST_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=origofs"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origofs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # origofs-py is a pyo3 extension, so building the workspace needs a Python
      # interpreter available for it to link against.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          # The access surfaces (api/mcp/sandbox/git/fuse/nfs) are default-off
          # features of origofs-sdk. `--workspace` builds their code via the CLI's
          # `full`, but lint the surface modules + their gated tests explicitly too.
          cargo clippy -p origofs-sdk --features full --all-targets -- -D warnings

      # Postgres tests self-skip without ORIGOFS_PG_TEST_URL; the S3/GCS integration
      # tests are #[ignore]d; and the FUSE / NFS / overlayfs tests self-skip when
      # the needed privileges aren't present — so the suite is green on a stock
      # runner with no extra services.
      # nextest is the primary runner (per-test hang guard + retries; see
      # .config/nextest.toml). It doesn't run doctests, so those run via
      # `cargo test --doc` afterward (the one executable doctest, nfs.rs, is
      # gated by `full`).
      - name: Test
        run: |
          cargo nextest run --profile ci --workspace
          # Run the surface-gated tests (api/mcp/sandbox/git/fuse/nfs) explicitly,
          # rather than relying on workspace feature-unification to enable them.
          cargo nextest run --profile ci -p origofs-sdk --features full
          cargo test --workspace --doc
          cargo test -p origofs-sdk --features full --doc

      # The opt-in `coedit` feature (yrs-backed CRDT co-editing, roadmap M8) is
      # off by default for origofs-core and origofs-sdk, so exercise it — clippy +
      # tests — explicitly. `-p origofs-sdk --features coedit` covers coedit without
      # the API (proving the `axum?/ws` weak-dep stays axum-free); `full,coedit`
      # covers the API's y-sync WebSocket + every surface. (origofs-py enables coedit
      # unconditionally, so the default workspace build already covers its
      # compilation; its live co-editing is tested in the Python job.)
      - name: Test coedit feature
        run: |
          cargo clippy -p origofs-core --features coedit --all-targets -- -D warnings
          cargo clippy -p origofs-sdk --features coedit --all-targets -- -D warnings
          cargo clippy -p origofs-sdk --features full,coedit --all-targets -- -D warnings
          cargo nextest run --profile ci -p origofs-core --features coedit
          cargo nextest run --profile ci -p origofs-sdk --features coedit
          cargo nextest run --profile ci -p origofs-sdk --features full,coedit

  # B1 (#70): code-coverage signal. Instrument the same test invocations the
  # `rust` job runs — the default workspace suite plus the origofs-sdk `full`
  # surfaces (api/mcp/sandbox/git/fuse/nfs are default-off features, otherwise
  # invisible to coverage) — merge them into one lcov report, and upload to
  # Codecov. Uses the Postgres service so the PG-gated paths count too.
  coverage:
    name: Coverage (llvm-cov + Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORIGOFS_PG_TEST_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=origofs"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origofs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # origofs-py is a pyo3 extension, so building the workspace needs a Python
      # interpreter available for it to link against.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --workspace
          cargo llvm-cov --no-report -p origofs-sdk --features full
          cargo llvm-cov report --lcov --output-path lcov.info

      # Tokenless upload works for public repos; set the CODECOV_TOKEN secret to
      # make it reliable. A Codecov hiccup must not fail the build, so the upload
      # is best-effort — the gate lives in codecov.yml (status checks).
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # B4 (#70): supply-chain gate. RUSTSEC advisories, the license allow-list, and
  # source pinning from deny.toml. Reads Cargo metadata only — no workspace
  # build — so it's fast and independent of the test jobs.
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # B5 (#70): MSRV floor. edition 2024 sets a 1.85 *language* floor, but the real
  # minimum is higher — the code uses let-chains (stabilized in 1.88), and the
  # dependency graph (icu, via url/object_store) needs >= 1.86 — so 1.88 is the
  # true floor. Pinning it catches an accidental newer-stdlib use (or a
  # dependency MSRV bump) before it silently raises the minimum. `cargo check`
  # only — compilation is what MSRV is about — and `--locked` so the committed
  # Cargo.lock (not a fresh, newer-dep resolution) is what gets verified.
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      # origofs-py is a pyo3 extension, so building the workspace needs a Python
      # interpreter available for it to link against.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: cargo check on the MSRV toolchain
        run: |
          cargo check --workspace --locked
          # The default-off origofs-sdk surfaces (api/mcp/sandbox/git/fuse/nfs)
          # aren't built by --workspace; check them on the MSRV toolchain too.
          cargo check -p origofs-sdk --features full --locked

  python:
    name: Python bindings (maturin + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Python suite has PG-gated tests too; give it the same backend.
    env:
      ORIGOFS_PG_TEST_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=origofs"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origofs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build the extension into a venv and run the Python test suite, which
      # exercises the object-store content path (S3/GCS config + in-memory
      # roundtrip) from Python.
      - name: Build extension and run tests
        working-directory: crates/origofs-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # fastapi + httpx are needed by tests/test_fastapi_router.py — it
          # imports origofs.fastapi (the router integration) and fastapi's TestClient,
          # which rides on httpx. They are test-only deps, not runtime deps of origofs.
          pip install maturin pytest fastapi httpx
          maturin develop
          pytest -q tests
