name: Release

# Build the Python wheels and publish them, so a consumer can `pip install origofs`
# instead of cloning the repo at a SHA and running `maturin build` in a dedicated
# container stage (issue #96).
#
# The extension is abi3-py39 (`pyo3 = { features = ["abi3-py39"] }`), so **one
# wheel per platform covers CPython 3.9+** — there is no per-version build matrix.
#
# No system dependencies are needed on any leg:
#   * fuser's `libfuse` feature is off by default, so on Linux its build script
#     takes the `pure-rust` mount path and probes no pkg-config at all;
#   * macOS and Windows wheels carry no fuser — FUSE is scoped to
#     `cfg(target_os = "linux")` in crates/origofs-py/Cargo.toml, because macFUSE
#     is a kernel extension a wheel cannot provide. macOS mounts over NFSv3
#     (`serve_nfs`), which is pure Rust.
#
# **A release is only ever cut from a `v*` tag on `main`.** GitHub cannot express
# that here — `on.push.tags` matches a tag anywhere in the repo, with no branch
# filter — so the `main` half of the rule is enforced by the `guard` job below,
# which every other job depends on. The other half — *who* may cut a `v*` tag, and
# that a cut tag never moves — is a repository ruleset, kept alongside as
# `.github/rulesets/v-tags.json`; a ruleset cannot check what a tag points at,
# which is exactly why the `guard` job exists.
on:
  push:
    tags: ["v*"]
  # Dry runs: build every wheel without tagging or publishing anything.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The `main`-only half of the release rule (see the header). A `v*` tag pushed
  # at a commit that is not contained in `origin/main` — a side branch, a fork's
  # branch pushed here, a tag on a reverted commit — fails this job, and because
  # every other job `needs` it, nothing is built, attached to a Release, or
  # uploaded to PyPI.
  guard:
    name: Tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: `merge-base --is-ancestor` needs both the tagged commit and
      # main's, and a tag push checks out at depth 1 by default.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        shell: bash
        # Via env, not `${{ }}` interpolation — a tag name is attacker-shaped
        # input and must never be pasted into the script body.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            echo "Dry run ($EVENT, $GITHUB_REF) — wheels only, nothing is published."
            exit 0
          fi
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main." \
                 "Releases are only cut from v* tags on main — merge to main first, then tag."
            exit 1
          fi
          echo "Tag '$TAG' ($GITHUB_SHA) is on main."

  wheels:
    name: ${{ matrix.name }}
    needs: [guard]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --release --out dist
          # Cross-compiled inside maturin-action's container; the C toolchain for
          # the target comes with it (aws-lc-rs/ring need one).
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: --release --out dist
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --release --out dist
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --release --out dist
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --release --out dist
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          sccache: "true"
          # Only the Linux legs run in a container; ignored elsewhere.
          manylinux: ${{ startsWith(matrix.name, 'linux') && '2_28' || 'auto' }}
          working-directory: crates/origofs-py

      # A wheel that imports is the minimum bar for publishing one. Skipped where
      # the wheel can't run on the runner: linux-aarch64 is cross-compiled and
      # can't execute here, and macos-latest runners are arm64 so their Python
      # can't import the cross-built macos-x86_64 wheel.
      #
      # The script is shared with ci.yml's `windows` job rather than inlined here,
      # so the check that runs on every PR and the check that gates a release
      # cannot drift apart — and this copy is the one nobody would run until a tag
      # (#107).
      - name: Smoke-test the wheel
        if: matrix.name != 'linux-aarch64' && matrix.name != 'macos-x86_64'
        shell: bash
        working-directory: crates/origofs-py
        run: |
          python -m pip install --upgrade pip
          pip install --no-index --find-links dist origofs
          python ../../.github/scripts/wheel_smoke.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: crates/origofs-py/dist/*.whl

  sdist:
    name: sdist
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/origofs-py
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/origofs-py/dist/*.tar.gz

  # Attach every artifact to the GitHub Release. This alone fixes the worst of
  # #96 — a host can pin a URL + hash instead of carrying a Rust toolchain in a
  # build stage — and it needs no account setup, unlike the PyPI job below.
  github-release:
    name: Attach to GitHub Release
    needs: [guard, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a pre-release suffix (`v0.1.0-rc.1`) is marked as such, so
          # it doesn't show as the repository's latest release and `pip` won't
          # install it without `--pre`. GitHub does not infer this from semver.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publish to PyPI via Trusted Publishing (OIDC — no API token in secrets).
  #
  # Disabled until the project is set up for it, so tagging never fails on a
  # missing publisher. To enable:
  #   1. On PyPI, add a trusted publisher for the `origofs` project:
  #      owner `danplischke`, repo `origofs`, workflow `release.yml`,
  #      environment `pypi`.
  #   2. Create a `pypi` environment in the repo's settings.
  #   3. Set the repository variable PUBLISH_TO_PYPI to `true`.
  pypi:
    name: Publish to PyPI
    needs: [guard, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
