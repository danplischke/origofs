# origofs backend configuration — pass with `origofs --config <file>`.
#
# Without a config, origofs uses a local SQLite + local-CAS workspace under
# `--workspace`. This file selects the metadata store and content store instead,
# so the shipped `origofs serve` / `nfs` / `mcp` / `mount` daemons can front a
# production (Postgres + object-store) backend with no custom host program.
#
# Encryption at rest: set ORIGOFS_ENCRYPTION_KEY (a passphrase) and it applies to
# whichever backends you configure below, this one included. The key is derived
# with Argon2id over a per-store random salt kept beside the content — in the
# bucket for an object store — so it survives losing the metadata database and
# garbage collection never touches it. The same passphrase must be used on every
# open; a wrong one fails loudly rather than returning garbage.

# --- metadata store ---------------------------------------------------------
# backend = "sqlite"   # solo/offline (the default)
#   path = "/data/meta.db"        # optional; default <workspace>/meta.db
# backend = "postgres" # multi-writer/production
# TLS is negotiated per the DSN's `sslmode` (libpq's own keyword; default
# `prefer`). `require` refuses to connect unless the certificate verifies —
# deliberately stricter than libpq, where `require` encrypts but verifies nothing.
# Certificates are checked against the platform root store; for a private CA or a
# self-signed server, point ORIGOFS_PG_CA_FILE at its PEM bundle.
[metadata]
backend = "postgres"
dsn = "host=postgres user=origofs password=origofs dbname=origofs sslmode=prefer"

# --- content store ----------------------------------------------------------
# backend = "local"    # a sharded directory (default <workspace>/cas)
#   path = "/data/cas"
# backend = "s3"       # S3 / R2 / MinIO, or GCS via S3 interop
# backend = "gcs"      # native Google Cloud Storage (JSON API + OAuth2)
[content]
backend = "s3"
bucket = "origofs-content"
region = "us-east-1"
# endpoint = "http://minio:9000"  # for MinIO / R2 / a custom endpoint
# allow_http = true               # only with a custom endpoint (e.g. MinIO over HTTP)
# access_key_id = "..."           # omit to use the ambient AWS credential chain
# secret_access_key = "..."
# prefix = "objects"              # key prefix (default "objects")
packed = true                     # batch chunks into pack objects (recommended for object stores)
# index_dir = "/data/index"       # per-chunk pack index (default <workspace>/index)

# --- read cache (optional) --------------------------------------------------
# A bounded local LRU cache in front of the object store. Without it every read
# fetches every covering chunk over the network, every time. Bounded and
# LRU-evicting, so it cannot fill the disk; it also yields when the filesystem
# runs low, which matters when the cache shares a volume with anything else.
#
# Refused, deliberately, in two combinations: with `backend = "local"` (it would
# copy every chunk twice and speed up nothing) and with ORIGOFS_ENCRYPTION_KEY
# (encrypted objects are addressed by their plaintext hash, so a cache below the
# encryption layer fails its own integrity check on every hit and one above it
# writes plaintext to local disk).
#
# [cache]
# dir = "/var/cache/origofs"      # default <workspace>/cache
# max_bytes = 8589934592          # 8 GiB (default)
# min_free_bytes = 2147483648     # yield below 2 GiB free (default; Unix only)

# --- tuning (environment variables) -----------------------------------------
# Postgres pool. Sizing is a deployment property: 16 is far too many for a dozen
# sidecars sharing one small database and far too few for a busy single writer.
#   ORIGOFS_PG_POOL_SIZE=16
#   ORIGOFS_PG_WAIT_TIMEOUT_SECS=10       # bound waiting for a free connection
#   ORIGOFS_PG_CONNECT_TIMEOUT_SECS=10
#   ORIGOFS_PG_RECYCLE_TIMEOUT_SECS=10
#   ORIGOFS_PG_STATEMENT_TIMEOUT_MS=0     # 0 = off; see below
#   ORIGOFS_PG_CA_FILE=/etc/ssl/pg-ca.pem # trust a private CA for TLS
#
# A statement timeout is off by default on purpose. origofs's statements are
# small, but a few (`truncate_tree` on a large working tree, a wide `list_dir`)
# legitimately run long, and a timeout that aborts a checkout is worse than one
# that never fires. Set it if you want the ceiling.
#
# Object store. Explicit so a flaky bucket has stated behaviour rather than
# whatever the client library defaults to; a request with no timeout is the one
# that turns a slow S3 into a wedged server.
#   ORIGOFS_S3_TIMEOUT_SECS=60            # abandon a request with no response
#   ORIGOFS_S3_CONNECT_TIMEOUT_SECS=10    # fail fast on a mis-set endpoint
#   ORIGOFS_S3_MAX_RETRIES=5
#   ORIGOFS_S3_RETRY_TIMEOUT_SECS=180     # total elapsed retry budget

# ── Postgres + native GCS ─────────────────────────────────────────────────────
#
# The Google Cloud pairing. Uncomment and adjust; see docs/DEPLOY-GCS-POSTGRES.md
# for the caveats that actually bite (packed index locality, Cloud SQL TLS, and
# what garbage collection does and does not reclaim).
#
# [metadata]
# backend = "postgres"
# # Cloud SQL over a private IP or the auth proxy. Managed Postgres requires TLS:
# # set ORIGOFS_PG_CA_FILE to the server CA bundle.
# dsn = "host=10.0.0.5 user=origofs dbname=origofs sslmode=require"
#
# [content]
# backend = "gcs"
# bucket = "my-origofs-content"
# # Credentials resolve in this order: an explicit service-account key or key file,
# # then Application Default Credentials, then the GKE/GCE metadata server. On
# # workload identity, set none of them.
# # service_account_path = "/var/secrets/gcs.json"
# prefix = "objects"
# # `packed` batches chunks into few large objects, which is the right default for
# # a metered object store — but the per-chunk index is a LOCAL directory, so it is
# # single-writer-per-index. With more than one replica, either give each its own
# # index on a persistent volume and accept that they cannot share deduplication,
# # or leave `packed = false`.
# packed = false
# # index_dir = "/var/lib/origofs/index"
# # Plaintext endpoint — for a local emulator only. Never with real GCS.
# # allow_http = false
