[package]
name = "origo-fuse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
origo-sdk = { version = "0.1.0", path = "../origo-sdk" }
libc = "0.2.189"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"

# FUSE mounting is the Linux path; macOS uses the NFS surface instead (see
# origo-nfs). Building `fuser` normally on macOS requires macFUSE headers via
# pkg-config, which no CI runner (and few Macs) has — `macos-no-mount` compiles
# the crate without them, so the workspace and the Python wheel build on macOS.
# `mount`/`spawn` then return a plain io::Error there instead of failing to link.
[target.'cfg(not(target_os = "macos"))'.dependencies]
fuser = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.17", features = ["macos-no-mount"] }
