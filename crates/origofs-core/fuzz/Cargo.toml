# cargo-fuzz targets for the content-addressed object decoders (B3, #70).
#
# This crate builds *only* under `cargo +nightly fuzz` — libfuzzer-sys links the
# libFuzzer runtime and needs `-Z sanitizer`, so it must never be pulled into a
# stable `cargo build --workspace`. The empty `[workspace]` table below detaches
# it from the parent workspace to guarantee exactly that.
[package]
name = "origofs-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.origofs-core]
path = ".."
# The sidecar decoders live behind this feature, and a decoder nothing fuzzes is
# how a panic-on-malformed-input ships.
features = ["coedit"]

[profile.release]
debug = 1

# Each decoder is a self-contained `&[u8] -> Result<_>` boundary — the ideal
# fuzz surface. `test`/`doc`/`bench` are off so these never enter a normal test
# or doc build.
[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_decode"
path = "fuzz_targets/tree_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "commit_decode"
path = "fuzz_targets/commit_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "refsnapshot_decode"
path = "fuzz_targets/refsnapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar_decode"
path = "fuzz_targets/sidecar_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_sidecar_decode"
path = "fuzz_targets/tree_sidecar_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "coedit_state_decode"
path = "fuzz_targets/coedit_state_decode.rs"
test = false
doc = false
bench = false

# Not a decoder like the rest: `resolve` parses nothing. It is here because it
# maintains the non-overlap invariant that `posix_lock`'s primary key depends on,
# and a violation is a constraint error on a real `setlk`.
[[bin]]
name = "posix_lock_resolve"
path = "fuzz_targets/posix_lock_resolve.rs"
test = false
doc = false
bench = false

# The pack format: an index entry and a whole pack's trailer. Both are decoded
# from bytes fetched back out of an object store, and both were unfuzzed while
# every other self-describing format here had a target.
[[bin]]
name = "pack_index_decode"
path = "fuzz_targets/pack_index_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack_trailer_decode"
path = "fuzz_targets/pack_trailer_decode.rs"
test = false
doc = false
bench = false
