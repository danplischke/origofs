# Alembic configuration for developing origofs's OWN metadata schema.
#
# This file is for developing origofs itself — e.g. after editing
# python/origofs/db/models.py, run `alembic revision --autogenerate -m "..."`
# from this directory (crates/origofs-py) to draft the next migration.
#
# Applications *consuming* the installed `origofs` package should use
# `origofs.db.upgrade(url)` / `origofs.db.get_alembic_config(url)` instead —
# those point at the packaged migrations and need no ini file at all.

[alembic]
script_location = python/origofs/db/migrations
prepend_sys_path = . python

# No default URL: pass -x db_url=<url> (e.g. sqlite:///./dev.db) or set
# ORIGOFS_DATABASE_URL when running alembic commands against this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
