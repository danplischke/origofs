[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# The distribution is `origofs` because `origo` is taken on PyPI by an unrelated
# project. The *import* name is unaffected: `pip install origofs` -> `import origo`.
name = "origofs"
description = "Python bindings for origo (agent filesystem): async workspace ops, attribution, suggestions, and mount/NFS orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Dan Plischke" }]
keywords = [
    "filesystem",
    "versioning",
    "attribution",
    "blame",
    "content-addressed",
    "agents",
    "fuse",
    "nfs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Filesystems",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
# Sourced from crates/origo-py/Cargo.toml by maturin — that file is the single
# source of truth for the version, and the release workflow checks the git tag
# against it.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/danplischke/origofs"
Repository = "https://github.com/danplischke/origofs"
Issues = "https://github.com/danplischke/origofs/issues"
Documentation = "https://github.com/danplischke/origofs/blob/main/crates/origo-py/README.md"

[project.optional-dependencies]
# The `origo.fastapi` router integration (and the examples under examples/).
fastapi = ["fastapi", "uvicorn"]

[tool.maturin]
# Build the importable extension module (pyo3 resolves libpython at import).
features = ["extension-module"]
# Mixed layout: the pure-Python `origo` package lives under python/, and the
# compiled core is imported as its `origo._origo` submodule. Type stubs and
# py.typed ship inside python/origo/ automatically.
python-source = "python"
module-name = "origo._origo"
