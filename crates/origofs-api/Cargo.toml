[package]
name = "origofs-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
origofs-sdk = { version = "0.1.0", path = "../origofs-sdk" }
async-trait = "0.1.83"
axum = "0.8.7"
futures = { version = "0.3.33", optional = true }
getrandom = { version = "0.2", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[features]
# Opt-in live co-editing (roadmap M8): a WebSocket endpoint speaking the Yjs
# y-sync binary protocol, backed by a room coordinator (with cross-worker fan-out
# over Postgres when available). Pulls in the sdk coedit surface, axum's WebSocket
# support, futures' Stream/Sink combinators, and getrandom for the worker id.
coedit = ["origofs-sdk/coedit", "axum/ws", "dep:futures", "dep:getrandom"]

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
tokio-tungstenite = "0.24"
futures = "0.3.33"
# A genuine Yjs client for the co-editing WebSocket test: a raw `yrs::Doc` +
# the stock y-sync `DefaultProtocol`, exactly what PlateJS/y-websocket run.
yrs = "0.23"
# The cross-worker cluster test resets the Postgres schema directly.
tokio-postgres = "0.7"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
