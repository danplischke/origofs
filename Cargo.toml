[workspace]
resolver = "2"
members = [
    "crates/origofs-core",
    "crates/origofs-sdk",
    "crates/origofs-cli",
    "crates/origofs-py",
    # A third-party-shaped consumer of `origofs-sdk`, kept in the workspace so
    # `cargo build --workspace` / `clippy --all-targets` compile the *embedding*
    # path too. Nothing depends on it; it exists to fail loudly if the SDK stops
    # exporting something its own public API mentions. Not published.
    "examples/embed",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danplischke/origofs"
description = "origofs — an agent-and-human filesystem: content-addressed storage, pluggable metadata DB, opt-in Git-style versioning, and per-actor edit attribution"

# Milestone M0: skeleton + core traits (MetadataStore, ContentStore),
# a SQLite metadata backend, a local content-addressed store, and the
# working-tree engine. See docs/DESIGN.md and issue #1.
